name: Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # explicit include-based build matrix, of known valid options
      matrix:
        include:
          - os: windows-2022
            cuda: "12.6.2"
            visual-studio: "Visual Studio 17 2022"
            config: Release
            build_flags:
          - os: windows-2025
            cuda: "13.2.0"
            visual-studio: "Visual Studio 18 2026"
            config: Release
            build_flags:
          - os: windows-2025
            cuda: "13.2.0"
            visual-studio: "Visual Studio 18 2026"
            config: Debug
            build_flags:
          - os: windows-2025
            cuda: "13.2.0"
            visual-studio: "Visual Studio 18 2026"
            config: Debug
            build_flags: -DBARNEY_BACKEND_CPU=ON -DBARNEY_BACKEND_CUDA=OFF -DBARNEY_BACKEND_OPTIX=OFF

    env:
      cmake_generator: "${{ matrix.visual-studio }}"
      visual_studio: "${{ matrix.visual-studio }}"
      build_dir: "build"
    steps:
      - name: Checkout barney
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup MSVC (Windows)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup CUDA Toolkit
        uses: ./.github/actions/setup-cuda
        with:
          cuda-version: ${{ matrix.cuda }}

      - name: create shared install dir
        run: |
          mkdir ${{github.workspace}}\install

      - name: Build ANARI-SDK
        uses: ./.github/actions/build-anari-sdk
        with:
          config: ${{ matrix.config }}
          install-prefix: ${{ github.workspace }}\install
          build-deps-path: ${{ github.workspace }}\install
          generator: ${{ matrix.generator }}

      - name: CMake Configure barney
        run: |
          mkdir ${{github.workspace}}\build
          cd ${{github.workspace}}\build
          cmake -A x64 -G "${{ matrix.visual-studio }}" .. -DCMAKE_INSTALL_PREFIX=${{github.workspace}}\install ${{ matrix.build_flags }}

      - name: build barney
        run: |
          cd ${{github.workspace}}\build
          cmake --build . --config ${{ matrix.config }}

      - name: install barney
        run: |
          cd ${{github.workspace}}\build
          cmake --install .  --config ${{ matrix.config }}
