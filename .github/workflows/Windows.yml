name: Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # explicit include-based build matrix, of known valid options
      matrix:
        include:
          - os: windows-2022
            cuda: "12.6.2"
            visual-studio: "Visual Studio 17 2022"
            shell: "powershell"
            config: Release
            build_flags:
          - os: windows-2025
            cuda: "13.5.0"
            visual-studio: "Visual Studio 18 2026"
            shell: "powershell"
            config: Release
            build_flags:
          - os: windows-2025
            cuda: "13.5.0"
            visual-studio: "Visual Studio 18 2026"
            shell: "powershell"
            config: Debug
            build_flags:
          - os: windows-2025
            cuda: "13.5.0"
            visual-studio: "Visual Studio 18 2026"
            shell: "powershell"
            config: Debug
            build_flags: -DBARNEY_BACKEND_CPU=ON -DBARNEY_BACKEND_CUDA=OFF -DBARNEY_BACKEND_OPTIX=OFF

    env:
      cmake_generator: "${{ matrix.visual-studio }}"
      visual_studio: "${{ matrix.visual-studio }}"
      build_dir: "build"
    steps:
      - name: Checkout barney
        uses: actions/checkout@v5
        with:
          submodules: true

      # ------------- Windows: NVIDIA redistributable archives -------------
      - name: Install CUDA (Windows)
        if: contains(matrix.cuda, '.')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base     = 'https://developer.download.nvidia.com/compute/cuda/redist'
          $manifest = Invoke-RestMethod "$base/redistrib_${{ matrix.cuda }}.json"
          $cudaHome = Join-Path $env:RUNNER_TEMP 'cuda'
          New-Item -ItemType Directory -Force $cudaHome | Out-Null
          foreach ($c in 'cuda_nvcc','cuda_crt','libnvvm','cuda_cudart','cuda_cccl') {
            $entry = $manifest.$c.'windows-x86_64'
            if (-not $entry) { Write-Host "skipping $c (not in manifest)"; continue }
            $zip = Join-Path $env:RUNNER_TEMP (Split-Path $entry.relative_path -Leaf)
            Write-Host "downloading $c"
            Invoke-WebRequest "$base/$($entry.relative_path)" -OutFile $zip
            $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
            if ($hash -ne $entry.sha256.ToUpper()) { throw "checksum mismatch for $c" }
            $tmp = Join-Path $env:RUNNER_TEMP "x_$c"
            Expand-Archive $zip -DestinationPath $tmp
            Copy-Item -Recurse -Force (Join-Path (Get-ChildItem $tmp)[0].FullName '*') $cudaHome
          }
          "CUDA_PATH=$cudaHome"           >> $env:GITHUB_ENV
          "CUDACXX=$cudaHome\bin\nvcc.exe" >> $env:GITHUB_ENV
          "$cudaHome\bin"                 >> $env:GITHUB_PATH

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Checkout ANARI-SDK
        uses: actions/checkout@v5
        with:
          repository: "KhronosGroup/ANARI-SDK"
          path: ${{github.workspace}}/anari_sdk

      - name: create shared install dir
        run: |
          mkdir ${{github.workspace}}\install

      - name: CMake Configure ANARI-SDK
        run: |
          mkdir ${{github.workspace}}\anari_sdk\build
          cd ${{github.workspace}}\anari_sdk\build
          cmake -DCMAKE_BUILD_TYPE=${{matrix.config}} -A x64 -G "${{ matrix.visual-studio }}" .. -DCMAKE_INSTALL_PREFIX=${{github.workspace}}\install -DBUILD_HELIDE_DEVICE=OFF -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF

      - name: build ANARI-SDK
        run: |
          cd ${{github.workspace}}\anari_sdk\build
          cmake --build . --config ${{ matrix.config }}

      - name: install ANARI-SDK
        run: |
          cd ${{github.workspace}}\anari_sdk\build
          cmake --install . --config ${{ matrix.config }}

      - name: CMake Configure barney
        run: |
          mkdir ${{github.workspace}}\build
          cd ${{github.workspace}}\build
          cmake -A x64 -G "${{ matrix.visual-studio }}" .. -DCMAKE_INSTALL_PREFIX=${{github.workspace}}\install ${{ matrix.build_flags }} -DCMAKE_BUILD_TYPE=${{matrix.config}}

      - name: build barney
        run: |
          cd ${{github.workspace}}\build
          cmake --build . --config ${{ matrix.config }}

      - name: install barney
        run: |
          cd ${{github.workspace}}\build
          cmake --install .  --config ${{ matrix.config }}
